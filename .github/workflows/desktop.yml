# Baut das Desktop-Programm für macOS (Apple Silicon und Intel) und Windows.
# Bei jeder Änderung im Ordner desktop/ auf main (oder manuell) wird gebaut und unter der
# Version aus desktop/package.json veröffentlicht (Tag v<Version> legt die Aktion selbst an).
# Neue Version: in desktop/package.json "version" erhöhen.
name: Desktop-App
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            args: --mac --arm64
          - os: macos-14
            arch: x64
            args: --mac --x64
          - os: windows-latest
            arch: x64
            args: --win --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" || true
      - name: Programm bauen
        run: npm run dist -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: sprintz-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
      - name: Version lesen
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Sprintz ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
