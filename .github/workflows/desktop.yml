# Baut das Desktop-Programm für macOS (Apple Silicon und Intel) und Windows.
# Bei einem Tag v* (z. B. v1.0.1) entsteht automatisch eine Veröffentlichung mit den Installationsdateien.
name: Desktop-App
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            args: --mac --arm64
          - os: macos-14
            arch: x64
            args: --mac --x64
          - os: windows-latest
            arch: x64
            args: --win --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Version aus dem Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" || true
      - name: Programm bauen
        run: npm run dist -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: sprintz-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
      - name: Veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
